[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14.5"
dependencies = [
    "django>=6.0,<6.1",
    "django-cors-headers>=4.9,<5.0",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "drf-spectacular>=0.29,<0.30",
    "gunicorn>=25.1,<25.2",
    "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2,<5.3",
    "mypy>=1.19,<1.20",
    "pytest>=9.0,<10.0",
    "pytest-django>=4.12,<5.0",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.development"
